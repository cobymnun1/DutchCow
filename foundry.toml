[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200

remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/contracts/",
    "lib/composable-cow/:@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "composable-cow/=lib/composable-cow/",
    "cowprotocol/=lib/composable-cow/lib/cowprotocol/src/",
    "safe/=lib/composable-cow/lib/safe/contracts/"
]
